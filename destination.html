<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Destino — Cusco Pathways Adventures</title>
  <meta name="description" content="Explora nuestras rutas curadas en este destino extraordinario." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════ NAVBAR ═══ -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <div class="nav-inner">
        <a href="index.html" class="logo-text" id="logo-link">
          Cusco <span>Pathways</span>
        </a>
        <ul class="nav-links" role="list">
          <li><a href="index.html#destinations" class="nav-link">Destinos</a></li>
          <li><a href="index.html#manifesto" class="nav-link">Manifiesto</a></li>
          <li><a href="index.html#footer" class="nav-link">Contacto</a></li>
        </ul>
        <button class="hamburger" id="hamburger" aria-label="Abrir menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
      <ul role="list">
        <li><a href="index.html#destinations" class="nav-link">Destinos</a></li>
        <li><a href="index.html#manifesto" class="nav-link">Manifiesto</a></li>
        <li><a href="index.html#footer" class="nav-link">Contacto</a></li>
      </ul>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════ DESTINATION HERO ═══ -->
  <header class="tour-hero" id="dest-hero">
    <div class="tour-hero-bg">
      <img src="dest_salkantay.png" alt="Destination Hero Banner" id="dest-banner-img" />
    </div>
    <div class="container">
      <div class="tour-hero-content">
        <span class="tour-category">Destino</span>
        <h1 class="tour-main-title" id="dest-title-display">Salkantay</h1>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════ TOURS LIST ═══ -->
  <main class="tour-content-section">
    <div class="container">
      <a href="index.html#destinations" class="back-link">
        &larr; Volver a Destinos
      </a>

      <h2 class="section-title" style="margin-bottom: 40px; font-size: 1.5rem; letter-spacing: 0.1em; color: var(--primary-green);">Rutas Disponibles</h2>
      
      <!-- List of Tours for this Destination -->
      <div class="tours-grid" id="dest-tours-list">
        <!-- JS will populate the horizontal cards here -->
      </div>
    </div>
  </main>

  <!-- ═══════════════════════════════════════════ FOOTER ═══ -->
  <footer class="footer" id="footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <a href="index.html" class="footer-logo">Cusco <span>Pathways</span></a>
        </div>
        <div class="footer-contact-card">
          <a href="mailto:info@cuscopathways.com" class="footer-email">info@cuscopathways.com</a>
          <span class="footer-phone">+51 984 000 000</span>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 Cusco Pathways Adventures. Todos los derechos reservados.</p>
        <nav class="footer-nav" aria-label="Enlaces secundarios">
          <a href="index.html#destinations">Destinos</a>
          <a href="index.html#manifesto">Manifiesto</a>
        </nav>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
